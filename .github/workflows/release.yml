name: Release

# 打 tag (v*) 后自动构建四平台产物并上传到 GitHub Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 前端产物已内嵌提交 (internal/server/gateway/web/index.html), 直接交叉编译
      # 版本/commit 由 CI 注入 buildinfo 占位符
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          out="netherproxy"
          if [ "${{ matrix.goos }}" = "windows" ]; then out="netherproxy.exe"; fi
          go build -trimpath -ldflags "-s -w \
            -X NetherProxy/internal/buildinfo.Version=${GITHUB_REF_NAME#v} \
            -X NetherProxy/internal/buildinfo.Commit=${GITHUB_SHA::7}" \
            -o "$out" ./cmd/netherproxy

      # 打包: netherproxy-<tag>-<os>-<arch>/ 内含 二进制 + docs/ + agents.md
      # (agents.md 即 docs/skill/netherproxy-setup.md, 放部署根目录便于 AI 助手读取)
      - name: Package
        run: |
          name="netherproxy-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          bin="netherproxy"
          if [ "${{ matrix.goos }}" = "windows" ]; then bin="netherproxy.exe"; fi
          mkdir -p "$name"
          mv "$bin" "$name/"
          cp -r docs "$name/"
          cp docs/skill/netherproxy-setup.md "$name/agents.md"
          tar -czf "$name.tar.gz" "$name"

      - name: Checksum
        run: for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
